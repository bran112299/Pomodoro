# XcodeGen spec: `brew install xcodegen && xcodegen generate` creates ProveToUnlock.xcodeproj.
name: ProveToUnlock
options:
  bundleIdPrefix: com.provetounlock
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  ProveCore:
    path: ProveCore
targets:
  ProveToUnlock:
    type: application
    platform: iOS
    sources:
      - path: ProveToUnlock
    dependencies:
      - package: ProveCore
      - target: ScreenTimeMonitor
        embed: true
    entitlements:
      path: ProveToUnlock/ProveToUnlock.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.provetounlock.shared]
    info:
      path: ProveToUnlock/Info.plist
      properties:
        CFBundleDisplayName: Prove to Unlock
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Take a live photo as proof that you did your task. Photos are checked on this iPhone and never uploaded.
        NSLocationWhenInUseUsageDescription: Check that a proof photo was taken at the right place.
        NSLocationAlwaysAndWhenInUseUsageDescription: Notice when you arrive at and leave your places (like the gym), and whether you're away from your area, even when the app is closed.
        NSMotionUsageDescription: Use the barometer to confirm you went up or down floors.
        NSLocalNetworkUsageDescription: Link with your computers on this Wi-Fi to share proofs. No account or cloud.
        NSBonjourServices: [_provetounlock._tcp]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes: [location, fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.provetounlock.refresh]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.provetounlock.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme: {}

  ScreenTimeMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: ScreenTimeMonitor
      - path: ProveToUnlock/Services/Storage.swift
      - path: ProveToUnlock/Services/ShieldController.swift
    dependencies:
      - package: ProveCore
    entitlements:
      path: ScreenTimeMonitor/ScreenTimeMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [group.com.provetounlock.shared]
    info:
      path: ScreenTimeMonitor/Info.plist
      properties:
        CFBundleDisplayName: Prove to Unlock Monitor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).Monitor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.provetounlock.app.monitor
        TARGETED_DEVICE_FAMILY: "1"
