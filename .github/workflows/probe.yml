name: probe
on:
  push:
    branches: [claude/repo-creation-access-h4zmka]
    paths: [.github/workflows/probe.yml]
jobs:
  mac:
    runs-on: macos-latest
    steps:
      - run: sw_vers; xcodebuild -version; ls /Applications | grep -i xcode; xcrun simctl list runtimes; brew --version; which xcodegen || true
